  triggers:
    - uuid: 7fe19aa852184de4affde31c1190743f
      expression: 'min(/EDO Monitor by Zabbix agent active/edo.targets.failing,{$EDO.MASS.PERIOD})>={$EDO.MASS.MIN} and 100*min(/EDO Monitor by Zabbix agent active/edo.targets.failing,{$EDO.MASS.PERIOD})>={$EDO.MASS.PCT}*(last(/EDO Monitor by Zabbix agent active/edo.targets.total)-last(/EDO Monitor by Zabbix agent active/edo.targets.broken))'
      name: 'EDO: массовый отказ с хоста'
      event_name: 'EDO: с {HOST.NAME} недоступно {ITEM.LASTVALUE1} целей из {ITEM.LASTVALUE3}'
      opdata: 'Недоступно: {ITEM.LASTVALUE1} из {ITEM.LASTVALUE3}'
      url_name: 'Цели с отказом'
      url: 'zabbix.php?action=latest.view&hostids%5B%5D={HOST.ID}&tags%5B0%5D%5Btag%5D=component&tags%5B0%5D%5Boperator%5D=1&tags%5B0%5D%5Bvalue%5D=availability&filter_set=1'
      priority: HIGH
      description: |
        Последняя проверка закончилась отказом (класс 10–50) у {$EDO.MASS.PCT}% целей хоста и не меньше чем у {$EDO.MASS.MIN}: сеть, DNS, брандмауэр или прокси самого хоста, а не отдельные сервисы. Поднимается за 1–2 интервала проверки, раньше триггеров целей, поэтому они от него зависят. После закрытия цели, которые всё ещё не работают, поднимут свои триггеры на следующей проверке.

        Что делать: классы целей — в «Последних данных» (ссылка). 10 у всех — DNS хоста; 20 — нет маршрута или шлюза; 23 — брандмауэр хоста режет исходящие; 30/31 у всех — прокси или DPI на выходе.
      manual_close: 'YES'
      dependencies:
        - name: 'EDO: проба не работает на хосте'
          expression: 'last(/EDO Monitor by Zabbix agent active/edo.targets.total)>0 and (last(/EDO Monitor by Zabbix agent active/edo.targets.reporting)=0 or (last(/EDO Monitor by Zabbix agent active/edo.targets.broken)>={$EDO.MASS.MIN} and 100*last(/EDO Monitor by Zabbix agent active/edo.targets.broken)>={$EDO.MASS.PCT}*last(/EDO Monitor by Zabbix agent active/edo.targets.total)))'
          recovery_expression: 'last(/EDO Monitor by Zabbix agent active/edo.targets.total)=0 or (min(/EDO Monitor by Zabbix agent active/edo.targets.reporting,{$EDO.INTERVAL})>0 and (last(/EDO Monitor by Zabbix agent active/edo.targets.broken)<{$EDO.MASS.MIN} or 100*last(/EDO Monitor by Zabbix agent active/edo.targets.broken)<{$EDO.MASS.PCT}*last(/EDO Monitor by Zabbix agent active/edo.targets.total)))'
      tags:
        - tag: scope
          value: availability
    - uuid: 458ab50ec940473d9ce626afd4eb9863
      expression: 'last(/EDO Monitor by Zabbix agent active/edo.targets.total)>0 and (last(/EDO Monitor by Zabbix agent active/edo.targets.reporting)=0 or (last(/EDO Monitor by Zabbix agent active/edo.targets.broken)>={$EDO.MASS.MIN} and 100*last(/EDO Monitor by Zabbix agent active/edo.targets.broken)>={$EDO.MASS.PCT}*last(/EDO Monitor by Zabbix agent active/edo.targets.total)))'
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: 'last(/EDO Monitor by Zabbix agent active/edo.targets.total)=0 or (min(/EDO Monitor by Zabbix agent active/edo.targets.reporting,{$EDO.INTERVAL})>0 and (last(/EDO Monitor by Zabbix agent active/edo.targets.broken)<{$EDO.MASS.MIN} or 100*last(/EDO Monitor by Zabbix agent active/edo.targets.broken)<{$EDO.MASS.PCT}*last(/EDO Monitor by Zabbix agent active/edo.targets.total)))'
      name: 'EDO: проба не работает на хосте'
      event_name: 'EDO: проба не работает на {HOST.NAME}'
      opdata: 'С данными за {$EDO.NODATA.HOST}: {ITEM.LASTVALUE2} из {ITEM.LASTVALUE1}, класс 90–91: {ITEM.LASTVALUE3}'
      url_name: 'Последние данные EDO'
      url: 'zabbix.php?action=latest.view&hostids%5B%5D={HOST.ID}&tags%5B0%5D%5Btag%5D=component&tags%5B0%5D%5Boperator%5D=1&tags%5B0%5D%5Bvalue%5D=probe&filter_set=1'
      priority: AVERAGE
      description: |
        Ни одна цель не прислала класс за {$EDO.NODATA.HOST} или у {$EDO.MASS.PCT}% целей класс 90–91. Агент при этом жив: от его триггеров этот зависит. Закрывается, только когда данные идут непрерывно {$EDO.INTERVAL}, — иначе nodata целей, ещё не успевших ответить, поднялись бы сразу после закрытия. О доступности сервисов это ничего не говорит.

        Что делать:
        - нет данных — нет edo-monitor.conf в zabbix_agent2.d или агент не перезапущен после раскладки; элементы «ответ пробы» не поддерживаются — текст ошибки в их свойствах; powershell.exe не укладывается в {$EDO.TIMEOUT} (перегруз хоста);
        - класс 91 у всех — edo.ps1 отсутствует, повреждён или powershell.exe пишет в stderr: поле error в истории «ответ пробы».
      manual_close: 'YES'
      dependencies:
        - name: 'Windows: Active checks are not available'
          expression: 'min(/Windows by Zabbix agent active/zabbix[host,active_agent,available],{$AGENT.TIMEOUT})=2'
        - name: 'Windows: Zabbix agent is not available'
          expression: 'nodata(/Windows by Zabbix agent active/agent.ping,{$AGENT.NODATA_TIMEOUT})=1'
      tags:
        - tag: scope
          value: data-collection
