          description: 'Окно, за которое ни одна цель хоста не прислала класс, для Average «проба не работает на хосте». Меньше {$EDO.NODATA} хотя бы на интервал проверки: иначе первые замолчавшие цели поднимут свои триггеры раньше хостового.'
        - macro: '{$EDO.NODATA:"stall"}'
          value: 3h
          description: 'Окно без данных для режима stall; больше {$EDO.INTERVAL:"stall"}.'
        - macro: '{$EDO.SCRIPT.MD5}'
          value: a96dc03cdaafdda2502c2a4facc19091
          description: 'MD5 текущей версии agent/edo.ps1 (в CRLF, как после checkout). Меняется вместе со скриптом; расхождение на хосте — Average.'
        - macro: '{$EDO.SLOW.MS}'
