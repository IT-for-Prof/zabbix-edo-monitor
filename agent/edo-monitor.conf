# EDO Monitor: проба доступности сервисов ЭДО для шаблона «EDO Monitor by Zabbix agent active».
# itforprof.com by Konstantin Tyutyunnik — https://github.com/IT-for-Prof/zabbix-edo-monitor
#
# Установка (подробно — README, раздел «Установка»):
#   1. edo.ps1 -> C:\Program Files\Zabbix Agent 2\scripts\edo.ps1
#      (запись в каталог scripts — только Administrators и SYSTEM: скрипт исполняется от LocalSystem).
#   2. Этот файл -> C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\edo-monitor.conf
#      (в zabbix_agent2.conf должен быть Include=C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\ — в стандартной установке есть).
#   3. Перезапустить службу «Zabbix Agent 2».
#   4. Привязать к хосту шаблон «EDO Monitor by Zabbix agent active» вместе с «Windows by Zabbix agent active».
#
# Параметры ключа приходят из макросов {$EDO.TARGETS.*} через обнаружение: mode, host, port, path.
# UnsafeUserParameters не включать: неверные записи обнаружение превращает в безопасную цель «invalid».
# Таймаут задаёт шаблон ({$EDO.TIMEOUT}); проба сама укладывается в 25 с.

UserParameter=edo.probe[*],powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\edo.ps1" "$1" "$2" "$3" "$4"
